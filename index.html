<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2a1420" />
  <title>Painted — Links</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <link rel="preload" as="image" href="images/studios/artstudio.jpg" />
  <link rel="preload" as="image" href="images/artsy/frame1.png" />
  <link rel="preload" as="image" href="images/photo/frame1.png" />
  <link rel="preload" as="image" href="images/glasses/frame1.png" />
  <link rel="preload" as="image" href="images/howdy/frame1.png" />
  <link rel="preload" as="image" href="images/strokes/business.png" />
  <link rel="preload" as="image" href="images/strokes/tiktok.png" />
  <link rel="preload" as="image" href="images/strokes/youtube.png" />
  <link rel="preload" as="image" href="images/strokes/website.png" />

  <link rel="stylesheet" href="css/butterfly.css" />
</head>
<body data-bg="artstudio">

  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-tint" aria-hidden="true"></div>

  <div class="sprite-layer" id="spriteButterflies" data-sprite="butterflies" aria-hidden="true"></div>
  <div class="sprite-layer" id="spriteGlitter"     data-sprite="glitter"     aria-hidden="true"></div>
  <div class="sprite-layer" id="spriteNotes"       data-sprite="notes"       aria-hidden="true"></div>
  <div class="sprite-layer" id="spriteHearts"      data-sprite="hearts"      aria-hidden="true"></div>

  <header class="topbar">
    <div class="toggles" role="group" aria-label="Sprite toggles">
      <button class="toggle toggle--on" data-toggle="butterflies" aria-pressed="true"  aria-label="Butterflies">🦋</button>
      <button class="toggle"            data-toggle="glitter"     aria-pressed="false" aria-label="Glitter">✨</button>
      <button class="toggle"            data-toggle="notes"       aria-pressed="false" aria-label="Music notes">🎵</button>
      <button class="toggle"            data-toggle="hearts"      aria-pressed="false" aria-label="Hearts">💕</button>
    </div>
  </header>

  <main class="stage">
    <div class="palette-wrap">

      <!-- Palette -->
      <svg class="palette" viewBox="0 0 400 540" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <filter id="woodgrain" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.5" numOctaves="2" seed="7" result="noise"/>
            <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
            <feComponentTransfer in="gray" result="soft">
              <feFuncA type="linear" slope="0.08" intercept="0"/>
            </feComponentTransfer>
            <feComposite in="soft" in2="SourceGraphic" operator="over"/>
          </filter>
          <radialGradient id="paletteShade" cx="30%" cy="20%" r="80%">
            <stop offset="0%"  stop-color="#fbf2e2"/>
            <stop offset="70%" stop-color="#f2e3cb"/>
            <stop offset="100%" stop-color="#e6d2b3"/>
          </radialGradient>
        </defs>

        <path class="palette-body"
              filter="url(#woodgrain)"
              fill="url(#paletteShade)"
              d="M200 20
                 C320 20 385 95 388 205
                 C392 300 340 400 250 465
                 C220 487 190 500 165 496
                 C135 491 108 468 88 428
                 C55 366 22 288 22 205
                 C22 100 90 20 200 20 Z" />
        <path class="palette-rim"
              fill="none"
              stroke="rgba(140,95,55,0.28)"
              stroke-width="1.6"
              d="M200 20
                 C320 20 385 95 388 205
                 C392 300 340 400 250 465
                 C220 487 190 500 165 496
                 C135 491 108 468 88 428
                 C55 366 22 288 22 205
                 C22 100 90 20 200 20 Z" />
        <ellipse class="palette-hole" cx="200" cy="455" rx="42" ry="26"
                 fill="#d9c19a" stroke="rgba(120,80,45,0.35)" stroke-width="2"/>
        <ellipse cx="200" cy="453" rx="36" ry="21" fill="#c8ad84" opacity="0.7"/>
      </svg>

      <!-- Quote, etched at the top -->
      <div class="quote-layer">
        <svg class="quote-etch" viewBox="0 0 320 76" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <filter id="burn" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="5" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/>
            </filter>
          </defs>
          <text filter="url(#burn)" x="160" y="18" text-anchor="middle"
                font-family="Georgia, serif" font-style="italic" font-size="11"
                fill="#3d2410" opacity="0.95">"Life, like science and art,</text>
          <text filter="url(#burn)" x="160" y="34" text-anchor="middle"
                font-family="Georgia, serif" font-style="italic" font-size="11"
                fill="#3d2410" opacity="0.95">is a theory about the world"</text>
          <text filter="url(#burn)" x="160" y="52" text-anchor="middle"
                font-family="Georgia, serif" font-size="8" letter-spacing="2"
                fill="#3d2410" opacity="0.75">— JOHN D. BARROW</text>
        </svg>
      </div>

      <!-- Vial -->
      <div class="vial" id="vial" aria-hidden="true">
        <svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="vialGlass" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
              <stop offset="40%" stop-color="rgba(255,255,255,0.25)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0.55)"/>
            </linearGradient>
            <linearGradient id="vialLiquid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f7931e"/>
              <stop offset="50%" stop-color="#e1306c"/>
              <stop offset="100%" stop-color="#833ab4"/>
            </linearGradient>
          </defs>
          <rect x="14" y="2" width="12" height="8" rx="1" fill="#a97a4a" stroke="#6a4a2a" stroke-width="0.8"/>
          <rect x="15" y="9" width="10" height="6" fill="url(#vialGlass)" stroke="rgba(120,80,60,0.5)" stroke-width="0.6"/>
          <path d="M12 15 q-3 6 -3 18 q0 16 3 22 q2 3 8 3 q6 0 8 -3 q3 -6 3 -22 q0 -12 -3 -18 z"
                fill="url(#vialGlass)" stroke="rgba(120,80,60,0.55)" stroke-width="0.8"/>
          <path d="M14 24 q-2 6 -2 14 q0 12 2 16 q1 2 6 2 q5 0 6 -2 q2 -4 2 -16 q0 -8 -2 -14 z"
                fill="url(#vialLiquid)" opacity="0.85"/>
          <circle cx="18" cy="14" r="0.9" fill="#fff8e0" opacity="0.9"/>
          <circle cx="24" cy="20" r="0.7" fill="#fff8e0" opacity="0.8"/>
        </svg>
      </div>

      <!-- Swipes — hidden until painted -->
      <div class="palette-content">

        <a class="swipe swipe--business" href="#" target="_blank" rel="noopener" aria-label="Painting Instagram">
          <img class="swipe-paint" src="images/strokes/business.png" alt="" draggable="false" />
          <span class="swipe-cursive">business page</span>
          <span class="swipe-logo swipe-logo--end">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/>
              <circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2.2"/>
              <circle cx="17.5" cy="6.5" r="1.4" fill="#fff"/>
            </svg>
          </span>
        </a>

        <div class="group group--social">
          <a class="swipe swipe--tiktok" href="#" target="_blank" rel="noopener" aria-label="TikTok">
            <img class="swipe-paint" src="images/strokes/tiktok.png" alt="" draggable="false" />
            <span class="swipe-logo swipe-logo--end">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 3v3.2a5 5 0 0 0 4 3.9v3a8 8 0 0 1-4-1.3v5.7a5.8 5.8 0 1 1-5.8-5.8c.3 0 .7 0 1 .1v3.1a2.7 2.7 0 1 0 1.9 2.6V3h3z" fill="#fff"/>
              </svg>
            </span>
          </a>

          <a class="swipe swipe--yt" href="#" target="_blank" rel="noopener" aria-label="YouTube">
            <img class="swipe-paint" src="images/strokes/youtube.png" alt="" draggable="false" />
            <span class="swipe-logo swipe-logo--end">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2.5" y="5.5" width="19" height="13" rx="3.5" fill="#fff"/>
                <path d="M10 9.2l5 2.8-5 2.8V9.2z" fill="#cc0000"/>
              </svg>
            </span>
          </a>
        </div>

        <a class="swipe swipe--website" href="#" target="_blank" rel="noopener" aria-label="My Website">
          <img class="swipe-paint" src="images/strokes/website.png" alt="" draggable="false" />
          <span class="swipe-cursive swipe-cursive--center">My Website</span>
        </a>

      </div>

      <!-- Start buttons (stay until tapped) -->
      <div class="start-buttons" id="startButtons">
        <button class="pw-tool pw-tool--big" id="clickToPaint">
          <span class="pw-tool-icon">🎨</span>
          <span class="pw-tool-label">Click to Paint</span>
        </button>
        <button class="pw-tool pw-tool--big" id="skipToLinks">
          <span class="pw-tool-icon">→</span>
          <span class="pw-tool-label">Skip to Links</span>
        </button>
      </div>

      <!-- Brush -->
      <div class="brush" id="brush" aria-hidden="true">
        <svg viewBox="0 0 40 120" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 4 q2 -3 4 0 l3 58 q-5 3 -10 0 z" fill="#7a4a2a" stroke="#4a2a12" stroke-width="0.8"/>
          <path d="M15 62 h10 v10 h-10 z" fill="#b9b9c9" stroke="#6a6a78" stroke-width="0.6"/>
          <path d="M14 72 q6 3 12 0 q1 12 -2 22 q-4 8 -8 0 q-3 -10 -2 -22 z" fill="#e7d9c4" stroke="#a08860" stroke-width="0.6"/>
          <path class="brush-tip" d="M14 72 q6 3 12 0 q1 8 -1 14 q-5 4 -10 0 q-2 -6 -1 -14 z" fill="#e1306c" opacity="0.9"/>
        </svg>
      </div>

      <!-- Win98 paint window (your sizing, transparent body) -->
      <div class="paint-window" role="region" aria-label="Pixel me">
        <div class="pw-titlebar">
          <span class="pw-title">pixel me.jpg</span>
          <div class="pw-buttons" aria-hidden="true">
            <span class="pw-btn">_</span>
            <span class="pw-btn">□</span>
            <span class="pw-btn pw-btn--close">×</span>
          </div>
        </div>

        <div class="pw-canvas">
          <div class="mascot" id="mascot" role="button" tabindex="0" aria-label="Tap to hear a fact">
            <img class="mascot-sprite" id="mascotSprite"
                 src="images/artsy/frame1.png" alt="" draggable="false" />
            <div class="speech-bubble" id="speechBubble" role="status" aria-live="polite"></div>
          </div>
        </div>

        <div class="pw-palette-strip" aria-hidden="true">
          <span style="background:#f7931e"></span>
          <span style="background:#e1306c"></span>
          <span style="background:#833ab4"></span>
          <span style="background:#cc0000"></span>
          <span style="background:#0a0a0a"></span>
          <span style="background:#d4af37"></span>
          <span style="background:#7a2b4d"></span>
          <span style="background:#b9b9c9"></span>
        </div>

        <div class="pw-toolbar">
          <button class="pw-tool" id="playPauseBtn" aria-label="Pause animation">
            <span class="pw-tool-icon" id="playIcon">⏸</span>
          </button>
          <button class="pw-tool" id="outfitBtn" aria-label="Next outfit">
            <span class="pw-tool-icon">👗</span>
          </button>
        </div>

        <div class="pw-status" aria-hidden="true">
          <span class="pw-status-cell">click the avatar to learn more</span>
        </div>
      </div>

    </div>
  </main>

  <script src="js/animation.js"></script>
</body>
</html>
