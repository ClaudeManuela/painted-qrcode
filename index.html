<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2a1420" />
  <title>Painted — Links</title>
  <link rel="stylesheet" href="css/butterfly.css" />
</head>
<body data-bg="studio">

  <!-- Background layer (swapped by JS) -->
  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>

  <!-- Background change button -->
  <button class="bg-switch" id="bgSwitch" aria-label="Change background">
    <span class="bg-swatch"></span>
  </button>

  <!-- Main stage -->
  <main class="stage">

    <!-- Palette SVG -->
    <div class="palette-wrap">
      <svg class="palette" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Palette body will be drawn here -->
        <path class="palette-body" d="" />
        <!-- Thumb hole -->
        <ellipse class="palette-hole" cx="200" cy="470" rx="30" ry="20" />
      </svg>

      <!-- Swipes are HTML overlays so text/logos stay crisp -->
      <div class="swipes">

        <!-- Group 1: Painting business -->
        <div class="group group--painting">
          <span class="group-label">Painting</span>
          <div class="swipe-row">
            <a class="swipe swipe--ig-paint" href="#" target="_blank" rel="noopener" aria-label="Painting Instagram">
              <svg class="swipe-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
              </svg>
              <span class="swipe-label">Instagram</span>
            </a>
            <a class="swipe swipe--site-paint" href="#" target="_blank" rel="noopener" aria-label="Painting Website">
              <svg class="swipe-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="8.5" cy="9" r="1.4" fill="currentColor"/>
                <circle cx="15.5" cy="9" r="1.4" fill="currentColor"/>
                <circle cx="12" cy="15" r="1.4" fill="currentColor"/>
              </svg>
              <span class="swipe-label">Website</span>
            </a>
          </div>
        </div>

        <!-- Group 2: Social -->
        <div class="group group--social">
          <span class="group-label">Social</span>
          <div class="swipe-row">
            <a class="swipe swipe--tiktok" href="#" target="_blank" rel="noopener" aria-label="TikTok">
              <svg class="swipe-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 3v3.2a5 5 0 0 0 4 3.9v3a8 8 0 0 1-4-1.3v5.7a5.8 5.8 0 1 1-5.8-5.8c.3 0 .7 0 1 .1v3.1a2.7 2.7 0 1 0 1.9 2.6V3h3z" fill="currentColor"/>
              </svg>
              <span class="swipe-label">TikTok</span>
            </a>
            <a class="swipe swipe--ig-social" href="#" target="_blank" rel="noopener" aria-label="Personal Instagram">
              <svg class="swipe-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
              </svg>
              <span class="swipe-label">Instagram</span>
            </a>
            <a class="swipe swipe--yt" href="#" target="_blank" rel="noopener" aria-label="YouTube">
              <svg class="swipe-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2.5" y="5.5" width="19" height="13" rx="3.5" fill="currentColor"/>
                <path d="M10 9.2l5 2.8-5 2.8V9.2z" fill="#fff"/>
              </svg>
              <span class="swipe-label">YouTube</span>
            </a>
          </div>
        </div>

        <!-- Brush rest position (SVG inserted later) -->
        <div class="brush-slot" id="brushSlot" aria-hidden="true"></div>

      </div>
    </div>

    <!-- Portfolio + mascot, bottom-right -->
    <div class="corner">
      <a class="portfolio" href="#" target="_blank" rel="noopener" aria-label="Portfolio">
        <span class="portfolio-label">Portfolio</span>
      </a>
      <div class="mascot" id="mascot" role="button" tabindex="0" aria-label="Say hi">
        <!-- Pixel character sprite goes here later -->
        <div class="mascot-sprite" id="mascotSprite" aria-hidden="true"></div>
      </div>
    </div>

  </main>

  <!-- Quote -->
  <footer class="quote">
    <p>“Art is not what you see, but what you make others see.”</p>
    <span>— Edgar Degas</span>
  </footer>

  <script src="js/animation.js"></script>
</body>
</html>
